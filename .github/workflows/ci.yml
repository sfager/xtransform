name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux covers net8.0 and netstandard2.0; Windows adds net462 test runs.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test --no-build --configuration Release --filter "TestCategory!=Conformance" --logger trx --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Pack
        run: dotnet pack --configuration Release --output artifacts/packages -p:VersionSuffix=alpha.ci.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages

  conformance:
    name: Conformance (QT3 parse-only)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Load pinned test-suite commits
        id: pins
        run: |
          set -eo pipefail
          # shellcheck disable=SC1091
          source eng/test-suites.env
          echo "qt3_commit=$QT3_COMMIT" >> "$GITHUB_OUTPUT"
          echo "xslt_commit=$XSLT_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Cache W3C test suites
        uses: actions/cache@v4
        with:
          path: .testsuites
          key: testsuites-${{ steps.pins.outputs.qt3_commit }}-${{ steps.pins.outputs.xslt_commit }}

      - name: Fetch test suites (cache miss)
        run: bash eng/fetch-test-suites.sh

      - name: Restore
        run: dotnet restore

      - name: Build conformance
        run: dotnet build tests/XTransform.Conformance --no-restore --configuration Release

      - name: Run QT3 conformance (full evaluation, gate G2)
        run: dotnet test tests/XTransform.Conformance --no-build --configuration Release --filter "FullyQualifiedName~Qt3ConformanceTests" --logger "console;verbosity=minimal"

      - name: Upload QT3 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt3-summary
          path: artifacts/conformance

      - name: Enforce baseline
        run: bash eng/check-conformance-baseline.sh

  # XSLT conformance (gate G3) runs as two shards so a pull request gets fast feedback:
  #   core       everything except the Unicode 9.0 stress set (about 2 minutes)
  #   unicode-90 the stress set (its inputs are up to 54 MB; about an hour at the time of writing)
  # A failing test that is not listed in known-failures/xslt-g3.txt fails the shard, and
  # eng/check-xslt-baseline.sh enforces the per-shard floors and the combined 40% gate.
  conformance-xslt:
    name: Conformance (XSLT ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [core, unicode-90]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Load pinned test-suite commits
        id: pins
        run: |
          set -eo pipefail
          # shellcheck disable=SC1091
          source eng/test-suites.env
          echo "qt3_commit=$QT3_COMMIT" >> "$GITHUB_OUTPUT"
          echo "xslt_commit=$XSLT_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Cache W3C test suites
        uses: actions/cache@v4
        with:
          path: .testsuites
          key: testsuites-${{ steps.pins.outputs.qt3_commit }}-${{ steps.pins.outputs.xslt_commit }}

      - name: Fetch test suites (cache miss)
        run: bash eng/fetch-test-suites.sh

      - name: Restore
        run: dotnet restore

      - name: Build conformance
        run: dotnet build tests/XTransform.Conformance --no-restore --configuration Release

      - name: Run XSLT conformance (${{ matrix.shard }})
        env:
          XTRANSFORM_XSLT_SHARD: ${{ matrix.shard }}
          XTRANSFORM_XSLT_SETS: ${{ matrix.shard == 'unicode-90' && 'unicode-90' || '' }}
          XTRANSFORM_XSLT_SKIP_SETS: ${{ matrix.shard == 'core' && 'unicode-90' || '' }}
        run: >
          dotnet test tests/XTransform.Conformance --no-build --configuration Release
          --filter "FullyQualifiedName~XsltConformanceTests"
          --blame-hang-timeout 30m --blame-hang-dump-type none
          --logger "console;verbosity=minimal"

      - name: Upload XSLT summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xslt-summary-${{ matrix.shard }}
          path: artifacts/conformance

      - name: Enforce shard baseline
        run: bash eng/check-xslt-baseline.sh

  # Combines both shard summaries and enforces the gate G3 pass-rate (>= 40% of in-scope tests).
  xslt-gate:
    name: XSLT gate G3 (combined)
    runs-on: ubuntu-latest
    needs: conformance-xslt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: xslt-summary-*
          path: artifacts/conformance
          merge-multiple: true

      - name: Enforce combined baseline
        run: bash eng/check-xslt-baseline.sh
